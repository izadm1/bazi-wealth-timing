<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bazi Wealth Timing</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700;900&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout idea: almanac-style workbench — profile column on the left, report sheet on the right, hanzi pillars as the visual anchor */
:root{
  --paper:#F3F4F2; --sheet:#FFFFFF; --ink:#17191C; --muted:#5E6460; --line:#DDE0DC;
  --jade:#0E6A55; --jade-soft:#E2F0EB; --seal:#B3261E; --gold:#A97A12;
  --good:#1F7A4D; --warn:#B7791F; --bad:#B42318;
  --wood:#2F7D3B; --fire:#C9372C; --earth:#9A6B1E; --metal:#6B7280; --water:#1D4E89;
  --display:"Noto Serif SC","Songti SC","SimSun",Georgia,serif;
  --body:"IBM Plex Sans","Segoe UI",system-ui,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){
  --paper:#111413; --sheet:#191D1B; --ink:#E9ECE9; --muted:#9BA39E; --line:#2C322F;
  --jade:#4FBF9C; --jade-soft:#1C3029; --seal:#F0705F; --gold:#E0B44E;
  --good:#5CC48C; --warn:#E3A947; --bad:#F27A6B;
  --wood:#6CC27A; --fire:#F2715F; --earth:#D9A54E; --metal:#B3BAC4; --water:#6FA3E8; color-scheme:dark; } }
:root[data-theme="dark"]{
  --paper:#111413; --sheet:#191D1B; --ink:#E9ECE9; --muted:#9BA39E; --line:#2C322F;
  --jade:#4FBF9C; --jade-soft:#1C3029; --seal:#F0705F; --gold:#E0B44E;
  --good:#5CC48C; --warn:#E3A947; --bad:#F27A6B;
  --wood:#6CC27A; --fire:#F2715F; --earth:#D9A54E; --metal:#B3BAC4; --water:#6FA3E8; color-scheme:dark; }
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--paper);color:var(--ink);font:15px/1.55 var(--body)}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0}
.wrap{max-width:1280px;margin:0 auto;padding:20px 20px 60px}
header.top{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.sealmark{width:44px;height:44px;border-radius:6px;background:var(--seal);color:#fff;display:grid;place-items:center;font:900 22px var(--display);flex:none}
header.top h1{font-size:24px;font-weight:700}
header.top p{margin:2px 0 0;color:var(--muted);font-size:13px}
.layout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.panel{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:18px}
.panel h2{font-size:17px;margin-bottom:12px}
form .row{display:flex;flex-direction:column;gap:4px;margin-bottom:11px}
form .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{font-size:12.5px;font-weight:500;color:var(--muted)}
input,select{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:7px;padding:8px 9px;width:100%;min-width:0}
input:focus-visible,select:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--jade);outline-offset:2px}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink)}
.check input{width:auto}
details.adv{border-top:1px solid var(--line);margin-top:6px;padding-top:10px}
details.adv summary{cursor:pointer;font-size:13px;font-weight:600;color:var(--jade);margin-bottom:8px}
.hint{font-size:12px;color:var(--muted);margin:2px 0 0}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
button{font:600 14px var(--body);border-radius:7px;padding:9px 14px;cursor:pointer;border:1px solid var(--jade);background:var(--jade);color:#fff}
button.ghost{background:transparent;color:var(--jade)}
button.small{padding:6px 10px;font-size:13px}
.profiles{margin-bottom:14px}
.example{display:inline-block;font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--gold);border:1px solid var(--gold);border-radius:4px;padding:1px 6px;margin-left:6px;vertical-align:middle}
nav.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin-bottom:16px;overflow-x:auto}
nav.tabs a{padding:10px 14px;color:var(--muted);text-decoration:none;font-weight:600;font-size:14px;border-bottom:2px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--seal)}
.ctrl{display:flex;gap:10px;align-items:end;flex-wrap:wrap;margin-bottom:16px}
.ctrl .row{display:flex;flex-direction:column;gap:4px}
.ctrl input,.ctrl select{width:auto}
.sheet{background:var(--sheet);border:1px solid var(--line);border-radius:10px;padding:22px}
.sheet + .sheet{margin-top:16px}
.sheet h2{font-size:20px;margin-bottom:4px}
.sheet h3{font-size:16px;margin:18px 0 8px}
.sub{color:var(--muted);font-size:13px;margin:0 0 14px}
p{max-width:72ch}
.pillars{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.pillar{border:1px solid var(--line);border-radius:9px;padding:12px 8px;text-align:center;background:var(--paper)}
.pillar.dm{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.plabel{font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600}
.ptg{font-size:12.5px;font-weight:600;margin:6px 0 2px;min-height:19px}
.hz{font:900 46px/1.1 var(--display)}
.pin{font-size:12px;color:var(--muted)}
.hid{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 8px;margin-top:8px;border-top:1px dashed var(--line);padding-top:8px}
.hid span{font:700 16px var(--display);display:flex;flex-direction:column;align-items:center}
.hid small{font:500 10.5px var(--body);color:var(--muted)}
.unk{color:var(--muted);font-size:13px;padding:40px 0}
.e0{color:var(--wood)}.e1{color:var(--fire)}.e2{color:var(--earth)}.e3{color:var(--metal)}.e4{color:var(--water)}
.b0{background:var(--wood)}.b1{background:var(--fire)}.b2{background:var(--earth)}.b3{background:var(--metal)}.b4{background:var(--water)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:700px){.grid2,.grid3{grid-template-columns:1fr}.hz{font-size:34px}.pillars{gap:6px}}
.card{border:1px solid var(--line);border-radius:9px;padding:14px;background:var(--paper)}
.card h4{margin:0 0 6px;font-size:13px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.bars .bar{display:grid;grid-template-columns:70px 1fr 44px;align-items:center;gap:8px;font-size:13px;margin:5px 0}
.track{height:10px;background:var(--line);border-radius:5px;overflow:hidden}
.fill{height:100%;border-radius:5px}
.num{font-variant-numeric:tabular-nums}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:600;border-radius:999px;padding:3px 10px;border:1px solid currentColor;white-space:nowrap}
.s-prime{color:var(--good)}.s-good{color:var(--jade)}.s-neutral{color:var(--muted)}.s-care{color:var(--warn)}.s-bad{color:var(--bad)}
.hero{display:flex;gap:20px;align-items:center;flex-wrap:wrap}
.gauge{width:118px;height:118px;flex:none}
.gauge text{font-family:var(--body)}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.tag{font-size:12.5px;border-radius:6px;padding:3px 9px;background:var(--jade-soft);color:var(--jade);font-weight:600}
.tag.warn{background:transparent;border:1px solid var(--warn);color:var(--warn)}
ul.ints{padding-left:18px;margin:6px 0}
ul.ints li{margin:4px 0}
ul.ints li.neg::marker{color:var(--bad)} ul.ints li.pos::marker{color:var(--good)}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
td.hzc{font:700 17px var(--display)}
.tablewrap{overflow-x:auto}
.mini{display:inline-block;height:8px;border-radius:4px;vertical-align:middle;margin-right:6px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px}
.cal .dh{font-size:11px;text-transform:uppercase;color:var(--muted);text-align:center;font-weight:600}
.cal .dc{border-radius:7px;padding:6px;min-height:68px;border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;cursor:pointer;background:var(--paper);text-align:left;color:var(--ink);font:inherit}
.cal .dc:hover{border-color:var(--jade)}
.cal .dc .dn{font-weight:600;font-size:13px}
.cal .dc .dp{font:700 13px var(--display);color:var(--muted)}
.cal .dc .ds{font-size:12px;font-weight:600;margin-top:auto}
.cal .dc.today{outline:2px solid var(--seal);outline-offset:-2px}
.cal .blank{min-height:68px}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block}
.luck{display:flex;gap:8px;overflow-x:auto;padding-bottom:6px}
.lp{flex:0 0 96px;border:1px solid var(--line);border-radius:9px;padding:10px 6px;text-align:center;background:var(--paper)}
.lp.now{border-color:var(--seal);box-shadow:inset 0 0 0 1px var(--seal)}
.lp .hz{font-size:28px}
.lp .age{font-size:11.5px;color:var(--muted)}
.lp .sc{font-size:12px;font-weight:600;margin-top:4px}
.warnbox{border-left:3px solid var(--warn);background:var(--paper);padding:8px 12px;font-size:13px;margin:10px 0;border-radius:0 6px 6px 0}
.note{font-size:12.5px;color:var(--muted)}
.copyrow{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.toast{font-size:12.5px;color:var(--jade)}
svg text{fill:var(--muted);font-size:11px}
.hidden{display:none}
@media (prefers-reduced-motion:no-preference){.fill{transition:width .4s ease}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="sealmark" aria-hidden="true">财</div>
    <div>
      <h1>Bazi Wealth Timing</h1>
      <p>Four Pillars chart with daily, monthly, quarterly and yearly money forecasts</p>
    </div>
  </header>

  <div class="layout">
    <aside class="panel">
      <div class="profiles">
        <label for="profileSel">Saved profiles</label>
        <div style="display:flex;gap:6px;margin-top:4px">
          <select id="profileSel"></select>
          <button type="button" class="ghost small" id="delBtn" title="Delete selected profile">Delete</button>
        </div>
      </div>
      <h2>Birth details</h2>
      <form id="birthForm" autocomplete="off">
        <div class="row"><label for="fName">Name</label><input id="fName" placeholder="e.g. Myself"></div>
        <div class="two">
          <div class="row"><label for="fDate">Date of birth</label><input id="fDate" type="date" required min="1900-01-01" max="2099-12-31"></div>
          <div class="row"><label for="fTime">Time of birth</label><input id="fTime" type="time"></div>
        </div>
        <div class="row"><label class="check" for="fUnknown"><input id="fUnknown" type="checkbox"> Birth time unknown (three pillars only)</label></div>
        <div class="row"><label for="fGender">Gender (sets luck-pillar direction)</label>
          <select id="fGender"><option value="M">Male</option><option value="F">Female</option></select></div>
        <div class="row"><label for="fLoc">Birth location (optional)</label><select id="fLoc"></select>
          <p class="hint" id="locHint"></p></div>
        <div id="customLoc" class="two hidden">
          <div class="row"><label for="fLon">Longitude (° E)</label><input id="fLon" type="number" step="0.01" min="-180" max="180" placeholder="101.69"></div>
          <div class="row"><label for="fOff">UTC offset (hours)</label><input id="fOff" type="number" step="0.25" min="-12" max="14" placeholder="8"></div>
        </div>
        <details class="adv">
          <summary>Calculation settings</summary>
          <div class="row"><label for="fSolar">Hour pillar based on</label>
            <select id="fSolar"><option value="clock">Clock time (most commercial readings)</option><option value="true">True solar time (needs location)</option></select></div>
          <div class="row"><label for="fZi">11pm–midnight births</label>
            <select id="fZi"><option value="midnight">Day changes at midnight</option><option value="early">Day changes at 11pm</option></select></div>
          <p class="hint">Month and year pillars follow the exact solar terms (节气), with Li Chun starting the year.</p>
        </details>
        <div class="btns">
          <button type="submit">Read chart</button>
          <button type="button" class="ghost" id="saveBtn">Save profile</button>
        </div>
        <p class="toast" id="formMsg" role="status"></p>
      </form>
    </aside>

    <main>
      <nav class="tabs" aria-label="Report views">
        <a href="#chart" data-view="chart">Wealth chart</a>
        <a href="#daily" data-view="daily">Daily</a>
        <a href="#monthly" data-view="monthly">Monthly</a>
        <a href="#quarterly" data-view="quarterly">Quarterly</a>
        <a href="#yearly" data-view="yearly">Yearly</a>
      </nav>
      <div id="controls"></div>
      <div id="report"></div>
    </main>
  </div>
</div>

<script>
// ===== Bazi engine (wealth-focused) =====
const STEMS = ['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const STEM_PY = ['Jia','Yi','Bing','Ding','Wu','Ji','Geng','Xin','Ren','Gui'];
const BR = ['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const BR_PY = ['Zi','Chou','Yin','Mao','Chen','Si','Wu','Wei','Shen','You','Xu','Hai'];
const ANIMAL = ['Rat','Ox','Tiger','Rabbit','Dragon','Snake','Horse','Goat','Monkey','Rooster','Dog','Pig'];
const EL = ['Wood','Fire','Earth','Metal','Water'];
const EL_ZH = ['木','火','土','金','水'];
const BR_EL = [4,2,0,0,2,1,1,2,3,3,2,4];
const HIDDEN = [[9],[5,9,7],[0,2,4],[1],[4,1,9],[2,4,6],[3,5],[5,3,1],[6,8,4],[7],[4,7,3],[8,0]];
const HW = {1:[1],2:[0.7,0.3],3:[0.6,0.3,0.1]};
const mod = (a,n) => ((a % n) + n) % n;
const stemEl = s => Math.floor(s/2);
const stemYang = s => s % 2 === 0;
const idx60 = (s,b) => mod(6*s - 5*b, 60);

// ---- time ----
function jdnCivil(y,m,d){
  const a=Math.floor((14-m)/12), yy=y+4800-a, mm=m+12*a-3;
  return d+Math.floor((153*mm+2)/5)+365*yy+Math.floor(yy/4)-Math.floor(yy/100)+Math.floor(yy/400)-32045;
}
const jdFromMs = ms => ms/86400000 + 2440587.5;
const msFromJd = jd => (jd-2440587.5)*86400000;
function deltaT(y){
  const t=y-2000;
  if(y>=2005) return 62.92+0.32217*t+0.005589*t*t;
  if(y>=1986) return 63.86+0.3345*t-0.060374*t*t+0.0017275*t**3+0.000651814*t**4+0.00002373599*t**5;
  if(y>=1961){const u=y-1975; return 45.45+1.067*u-u*u/260-u**3/718;}
  if(y>=1941){const u=y-1950; return 29.07+0.407*u-u*u/233+u**3/2547;}
  if(y>=1920){const u=y-1920; return 21.20+0.84493*u-0.0761*u*u+0.0020936*u**3;}
  if(y>=1900){const u=y-1900; return -2.79+1.494119*u-0.0598939*u*u+0.0061966*u**3-0.000197*u**4;}
  const u=(y-1820)/100; return -20+32*u*u;
}
function sunLon(jdUT){
  const yr=2000+(jdUT-2451545)/365.25;
  const jd=jdUT+deltaT(yr)/86400;
  const T=(jd-2451545)/36525, r=Math.PI/180;
  const L0=280.46646+36000.76983*T+0.0003032*T*T;
  const M=(357.52911+35999.05029*T-0.0001537*T*T)*r;
  const C=(1.914602-0.004817*T-0.000014*T*T)*Math.sin(M)+(0.019993-0.000101*T)*Math.sin(2*M)+0.000289*Math.sin(3*M);
  const om=(125.04-1934.136*T)*r;
  return mod(L0+C-0.00569-0.00478*Math.sin(om),360);
}
function findLon(target, jdGuess){
  let jd=jdGuess;
  for(let i=0;i<60;i++){
    const d=mod(target-sunLon(jd)+180,360)-180;
    jd+=d/0.98564736;
    if(Math.abs(d)<1e-7) break;
  }
  return jd;
}
// "Jie" terms that start each solar month: 15°+30k
function prevJie(jd){ const l=sunLon(jd); const t=mod(15+30*Math.floor((l-15)/30),360); return {jd:findLon(t, jd-mod(l-t,360)/0.9856), lon:t}; }
function nextJie(jd){ const l=sunLon(jd); const t=mod(15+30*(Math.floor((l-15)/30)+1),360); return {jd:findLon(t, jd+mod(t-l,360)/0.9856), lon:t}; }

// time zone offset (minutes) for an IANA zone at a UTC instant
const _fmtCache={};
function tzOffsetMin(tz, ms){
  if(typeof tz==='number') return tz*60;
  const f=_fmtCache[tz]||(_fmtCache[tz]=new Intl.DateTimeFormat('en-US',{timeZone:tz,hourCycle:'h23',year:'numeric',month:'numeric',day:'numeric',hour:'numeric',minute:'numeric',second:'numeric'}));
  const p={}; f.formatToParts(new Date(ms)).forEach(x=>p[x.type]=x.value);
  const asUTC=Date.UTC(+p.year,+p.month-1,+p.day,+p.hour%24,+p.minute,+p.second);
  return Math.round((asUTC-ms)/60000);
}
function localToUtcMs(y,m,d,h,mi,tz){
  const naive=Date.UTC(y,m-1,d,h,mi);
  let off=tzOffsetMin(tz,naive);
  off=tzOffsetMin(tz,naive-off*60000);
  return {ms:naive-off*60000, off};
}
function eotMin(ms){ // equation of time (minutes)
  const dt=new Date(ms); const start=Date.UTC(dt.getUTCFullYear(),0,0);
  const N=(ms-start)/86400000; const B=2*Math.PI*(N-81)/364;
  return 9.87*Math.sin(2*B)-7.53*Math.cos(B)-1.5*Math.sin(B);
}

// ---- pillars ----
function yearMonthFromJd(jd, gYear, gMonth){
  const l=sunLon(jd);
  const m=Math.floor(mod(l-315,360)/30); // 0 = Yin month
  let by=gYear; if(gMonth<=2 && m>=10) by=gYear-1;
  if(gMonth>=11 && m<=1) by=gYear; // safety
  const yi=mod(by-4,60), ys=yi%10;
  const ms=mod((ys%5)*2+2+m,10), mb=(m+2)%12;
  return {year:{s:ys,b:yi%12}, month:{s:ms,b:mb}, baziYear:by, monthNo:m};
}
function dayPillarCivil(y,m,d){ const i=mod(jdnCivil(y,m,d)+49,60); return {s:i%10,b:i%12}; }
function hourPillar(dayStem, hb){ return {s:((dayStem%5)*2+hb)%10, b:hb}; }

/* opts: {y,m,d,h,mi, timeKnown, tz, lon, solar:'clock'|'mean'|'true', zi:'early'|'midnight', gender:'M'|'F'} */
function computeChart(o){
  const h=o.timeKnown?o.h:12, mi=o.timeKnown?o.mi:0;
  const {ms,off}=localToUtcMs(o.y,o.m,o.d,h,mi,o.tz);
  const jd=jdFromMs(ms);
  let effMs=ms+off*60000, solarNote=null;
  if(o.lon!=null && !isNaN(o.lon)){
    const meanMs=ms+o.lon/15*3600000;
    const trueMs=meanMs+eotMin(ms)*60000;
    solarNote={meanMs,trueMs,clockMs:ms+off*60000,offMin:off};
    if(o.solar==='mean') effMs=meanMs; else if(o.solar==='true') effMs=trueMs;
  }
  const e=new Date(effMs);
  const ey=e.getUTCFullYear(), em=e.getUTCMonth()+1, ed=e.getUTCDate(), eh=e.getUTCHours(), emi=e.getUTCMinutes();
  const ym=yearMonthFromJd(jd, o.y, o.m);
  let dj=jdnCivil(ey,em,ed);
  const late=o.timeKnown && eh===23;
  const dIdx=mod(dj+(late&&o.zi==='early'?1:0)+49,60);
  const day={s:dIdx%10,b:dIdx%12};
  let hour=null;
  if(o.timeKnown){
    const hb=Math.floor((eh+1)/2)%12;
    const stemDay= late ? mod(dj+1+49,60)%10 : day.s;
    hour=hourPillar(stemDay,hb);
  }
  const chart={input:o, utcMs:ms, offMin:off, effMs, solarNote, eff:{y:ey,m:em,d:ed,h:eh,mi:emi},
    pillars:{year:ym.year, month:ym.month, day, hour}, dm:day.s, gender:o.gender};
  // boundary warnings
  chart.warnings=[];
  const pj=prevJie(jd), nj=nextJie(jd);
  const hrsPrev=(jd-pj.jd)*24, hrsNext=(nj.jd-jd)*24;
  if(hrsPrev<3||hrsNext<3) chart.warnings.push(`Birth is within ${Math.min(hrsPrev,hrsNext).toFixed(1)} hours of a solar-term change, so the month pillar is sensitive to the exact birth time.`);
  if(o.timeKnown){ const mins=eh*60+emi; const into=mod(mins-(eh%2===1?eh:eh-1)*60,120); if(into<8||into>112) chart.warnings.push('Birth time is within 8 minutes of an hour-pillar boundary; confirm the exact time.'); }
  if(solarNote && o.timeKnown){
    const alt = o.solar==='clock' ? solarNote.trueMs : solarNote.clockMs;
    const a=new Date(alt); const ah=a.getUTCHours();
    const altHb=Math.floor((ah+1)/2)%12;
    if(hour && altHb!==hour.b) chart.warnings.push(o.solar==='clock'
      ? `With true-solar-time correction for this longitude the hour would be ${BR[altHb]} ${BR_PY[altHb]} instead of ${BR[hour.b]} ${BR_PY[hour.b]}${ah===23||eh===23?' (and the day pillar may also change)':''}. Schools differ; most commercial readings use clock time.`

  }
  chart.jd=jd;
  analyse(chart);
  luckPillars(chart, jd, pj, nj);
  return chart;
}

const TG = [
 {k:'F', en:'Friend', zh:'比肩'}, {k:'RW', en:'Rob Wealth', zh:'劫财'},

function tenGod(dm, s){
  const rel=mod(stemEl(s)-stemEl(dm),5); // 0 same,1 I produce,2 I control,3 controls me,4 produces me
  const same=stemYang(s)===stemYang(dm);
  return TG[rel*2+(same?0:1)];
}

// ---- analysis ----
function analyse(c){
  const P=c.pillars, dm=c.dm, dEl=stemEl(dm);
  const sc=[0,0,0,0,0];
  const stems=[P.year,P.month,P.day,P.hour].filter(Boolean);
  stems.forEach(p=>sc[stemEl(p.s)]+=1);
  const bw={year:1,month:2.5,day:1.3,hour:1};
  for(const k of ['year','month','day','hour']){
    const p=P[k]; if(!p) continue;
    const hs=HIDDEN[p.b], w=HW[hs.length];
    hs.forEach((s,i)=>sc[stemEl(s)]+=bw[k]*w[i]);
  }
  const total=sc.reduce((a,b)=>a+b,0);
  const comp=dEl, res=mod(dEl-1,5), out=mod(dEl+1,5), wea=mod(dEl+2,5), off=mod(dEl+3,5);
  const support=sc[comp]+sc[res], pct=support/total;
  let label = pct>=0.62?'Very strong':pct>=0.5?'Strong':pct>=0.42?'Slightly weak':pct>=0.3?'Weak':'Very weak';
  const strong=pct>=0.5;
  const fav=[0,0,0,0,0];
  let favOrder, unfOrder;
  if(strong){
    favOrder = sc[res]>sc[comp] ? [wea,out,off] : [off,wea,out];
    // for wealth focus, Output feeds Wealth: ensure Wealth is in top 2
    if(favOrder.indexOf(wea)>1) favOrder=[favOrder[0],wea,favOrder[1]];
    unfOrder = sc[res]>sc[comp] ? [res,comp] : [comp,res];
    fav[favOrder[0]]=2; fav[favOrder[1]]=1.5; fav[favOrder[2]]=1;
    fav[unfOrder[0]]=-1.6; fav[unfOrder[1]]=-1.1;
  } else {
    const drains=[out,wea,off].sort((a,b)=>sc[b]-sc[a]);
    favOrder = drains[0]===off ? [res,comp] : [comp,res];
    unfOrder = drains;
    fav[favOrder[0]]=2; fav[favOrder[1]]=1.5;
    fav[drains[0]]=-1.7; fav[drains[1]]=-1.2; fav[drains[2]]=-0.7;
  }
  const monthMain=HIDDEN[P.month.b][0];
  const inSeason=[comp,res].includes(stemEl(monthMain));
  // wealth structure
  const wealthCount=[];
  for(const k of ['year','month','day','hour']){
    const p=P[k]; if(!p) continue;
    if(k!=='day' && stemEl(p.s)===wea) wealthCount.push({where:k,pos:'stem',tg:tenGod(dm,p.s)});
    HIDDEN[p.b].forEach((s,i)=>{ if(stemEl(s)===wea) wealthCount.push({where:k,pos:i===0?'main hidden':'hidden',tg:tenGod(dm,s)}); });
  }
  const vault=[7,10,4,1,4][wea]; // tomb branch of wealth element: Wood未 Fire戌 Earth辰 Metal丑 Water辰
  c.an={sc,total,pct,label,strong,fav,favOrder,unfOrder,inSeason,
        roles:{comp,res,out,wea,off}, wealthCount, vault,
        noble:NOBLE[dm], monthMain};
}

// ---- luck pillars ----
function luckPillars(c, jd, pj, nj){
  if(!c.gender){ c.luck=null; return; }
  const yYang=stemYang(c.pillars.year.s);
  const fwd=(yYang&&c.gender==='M')||(!yYang&&c.gender==='F');
  const days=fwd?(nj.jd-jd):(jd-pj.jd);
  const startYears=days/3;
  const mi=idx60(c.pillars.month.s,c.pillars.month.b);
  const list=[];
  for(let i=1;i<=9;i++){
    const k=mod(mi+(fwd?i:-i),60);
    const ageStart=startYears+10*(i-1);
    const startMs=c.utcMs+ageStart*365.2422*86400000;
    list.push({s:k%10,b:k%12,ageStart,startMs,endMs:startMs+10*365.2422*86400000});
  }
  c.luck={fwd,startYears,list};
}

function interactions(c, p){

// ---- wealth scoring ----
function pillarScore(c, p){
  const an=c.an, dm=c.dm, R=an.roles;
  const hs=HIDDEN[p.b], w=HW[hs.length];
  let v=0.45*an.fav[stemEl(p.s)];
  hs.forEach((s,i)=>v+=0.55*w[i]*an.fav[stemEl(s)]);
  // wealth layer
  const elems=[{e:stemEl(p.s),wt:0.5}].concat(hs.map((s,i)=>({e:stemEl(s),wt:0.5*w[i]})));
  let wealthBonus=0;
  elems.forEach(({e,wt})=>{
    if(e===R.wea) wealthBonus+= an.strong?0.9*wt:0.35*wt;
    if(e===R.out) wealthBonus+= an.strong?0.45*wt:0.1*wt;   // output feeds wealth
    if(e===R.comp) wealthBonus+= an.strong?-0.6*wt:0.25*wt;  // rob wealth vs. support
  });
  const ints=interactions(c,p);
  let iv=ints.reduce((a,x)=>a+x.w,0);
  const raw=v+wealthBonus+iv;
  const score=Math.max(5,Math.min(95,Math.round(52+raw*13)));
  return {score, ints, stemTG:tenGod(dm,p.s), branchTG:tenGod(dm,hs[0]), raw};
}

function solarMonthsBetween(fromMs,toMs){
  const res=[]; let jd=jdFromMs(fromMs)-0.001;

  while(true){
    const n=nextJie(j.jd+0.5);

function pillarElWeights(p){ const w=[0,0,0,0,0]; w[stemEl(p.s)]+=1; const hs=HIDDEN[p.b], hw=HW[hs.length]; hs.forEach((s,i)=>w[stemEl(s)]+=hw[i]); return w; }
function outfit(c, p){

  why=`${EL[main]} is ${main===an.roles.wea?'your wealth element':'your most favourable element'}`;
  if(unf.length){
    const u=unf[0], ctrl=mod(u+3,5), drain=mod(u+1,5);

function recommend(c, di, hrs){
  const an=c.an, out=[];
  const fs=favNote_(c,di.ps.stemTG), fb=favNote_(c,di.ps.branchTG);
  const lead = fs>=fb ? di.ps.stemTG : di.ps.branchTG;
  const leadFav = Math.max(fs,fb);
  if(leadFav>0) out.push({t:TG_TASK[lead.k][0],why:`${lead.en} energy is favourable for you today`});
  else out.push({t:TG_TASK.RW[0],why:`today's energy (${di.ps.stemTG.en}) is not on your side, so protect what you have`});
  out.push({t:OFF_TASK[di.off.en],why:`${di.off.en} day ${di.off.zh}`});
  if(hrs){ const b=[...hrs].sort((a,b)=>b.ps.score-a.ps.score)[0]; const pad=n=>String(n).padStart(2,'0');
    out.push({t:`Book your most important money call or meeting for ${pad(b.from)}:00–${pad((b.to+23)%24)}:59`,why:`best hour of the day (${STEMS[b.p.s]}${BR[b.p.b]}, score ${b.ps.score})`}); }
  const ints=di.ps.ints;
  if(ints.some(x=>x.type==='noble')) out.push({t:`Ask a senior contact for an introduction; people born in ${an.noble.map(b=>ANIMAL[b]).join(' or ')} years are your helpers`,why:'Nobleman day'});
  if(ints.some(x=>x.type==='vault')) out.push({t:'Move surplus cash into savings or a fixed deposit',why:'Wealth Vault day'});
  if(ints.some(x=>x.type==='vaultopen')) out.push({t:'Expect a large transaction; double-check amounts and bank details before transferring',why:'your Wealth Vault is clashed open'});
  if(ints.some(x=>x.type==='clash'&&x.k==='day')) out.push({t:'Keep partnership and family discussions calm; re-read partnership documents before acting',why:'today clashes your Day branch'});
  if(ints.some(x=>x.type==='clash'&&x.k!=='day')) out.push({t:'Expect changes from clients or the market; confirm meetings and deadlines in the morning',why:'today clashes your chart'});
  if(ints.some(x=>x.type==='punish')) out.push({t:'Review legal and compliance paperwork twice before filing or sending',why:'punishment with your chart'});
  if(ints.some(x=>x.type==='harm')) out.push({t:'Put instructions and agreements in writing to avoid misunderstandings',why:'harm with your chart'});
  if(ints.some(x=>x.type==='scombo')) out.push({t:'An offer or person will attract you; consider it, but sleep on it before committing',why:'a stem combines with your Day Master'});
  if(di.score<62){ const fe=an.favOrder[0]; out.push({t:EL_TASK[fe],why:`activates ${EL[fe]}, your most favourable element, to lift a weaker day`}); }
  if(leadFav>0 && TG_TASK[lead.k][1]) out.push({t:TG_TASK[lead.k][1],why:lead.en});
  const seen=new Set(); return out.filter(x=>!seen.has(x.t)&&seen.add(x.t)).slice(0,6);
}

function bestUses(di){
  const out=[]; const o=di.off.en, s=di.ps.stemTG.k, b=di.ps.branchTG.k;
  if(['Success','Stable'].includes(o)) out.push('Sign and close');
  if(['Receive','Full','Initiate'].includes(o)) out.push('Collect payments');
  if(['Open','Establish'].includes(o)) out.push('Launch, new clients');
  const map={IW:'Deals and investments',DW:'Invoicing and collections',EG:'Sell your expertise',HO:'Pitch and negotiate',DO:'Tenders and approvals','7K':'Tough negotiations',DR:'Financing and paperwork',IR:'Research and due diligence',F:'Networking',RW:'Guard cash'};

}

// ----- shared helpers for ranges -----
function rangeDays(c,y0,m0,count){ const out=[]; for(let i=0;i<count;i++){ const yy=y0+Math.floor((m0-1+i)/12), mm=(m0-1+i)%12+1; const n=daysInMonth(yy,mm); for(let d=1;d<=n;d++) out.push(dayInfo(c,yy,mm,d,RTZ)); } return out; }
function avg(a){ return Math.round(a.reduce((x,y)=>x+y,0)/a.length); }
function dayList(list,title){
  return `<h3>${title}</h3><div class="tablewrap"><table><thead><tr><th>Date</th><th>Pillar</th><th>Day type</th><th>Use it for</th><th>Score</th></tr></thead><tbody>${list.map(d=>`<tr><td><button type="button" class="ghost small" data-goto="${d.y}-${pad(d.m)}-${pad(d.d)}">${DOW[d.dow]} ${d.d} ${MON[d.m-1]}</button></td><td class="hzc">${pz(d.day)}</td><td>${d.off.en} ${d.off.zh}</td><td>${bestUses(d).join(', ')}</td><td class="num" style="color:${scoreColor(d.score)};font-weight:600">${d.score}</td></tr>`).join('')}</tbody></table></div>`;
}
function solarMonthsOf(days){
  const seen=[]; days.forEach(d=>{ const k=pz(d.month); let s=seen.find(x=>x.k===k); if(!s){ s={k,p:d.month,days:[]}; seen.push(s);} s.days.push(d); }); return seen;
}
function monthCard(c,s){
  const ps=pillarScore(c,s.p); const a=s.days[0], b=s.days[s.days.length-1];
  return `<div class="card"><h4>Solar month ${s.k}</h4><p style="margin:0 0 4px">${chip(ps.score)}</p>
  <p class="note" style="margin:0 0 6px">${ppy(s.p)} · in range ${a.d} ${MON[a.m-1]} – ${b.d} ${MON[b.m-1]}</p>
  <p style="margin:0"><strong>${ps.stemTG.en}</strong> over <strong>${ps.branchTG.en}</strong>: ${TGX[ps.stemTG.k].h.toLowerCase()}; underneath, ${TGX[ps.branchTG.k].h.toLowerCase()}.</p>
  ${ps.ints.length?intList(ps.ints):''}</div>`;
}
function calendar(days,y,m){
  const first=new Date(Date.UTC(y,m-1,1)).getUTCDay(); const lead=(first+6)%7;
  const isT=d=>d.y===TODAY.y&&d.m===TODAY.m&&d.d===TODAY.d;
  return `<div class="cal">${['Mon','Tue','Wed','Thu','Fri','Sat','Sun'].map(x=>`<div class="dh">${x}</div>`).join('')}${'<div class="blank"></div>'.repeat(lead)}${days.map(d=>`<button type="button" class="dc ${isT(d)?'today':''}" data-goto="${d.y}-${pad(d.m)}-${pad(d.d)}" style="background:${cellBg(d.score)}" aria-label="${d.d} ${MON[d.m-1]}, score ${d.score}"><span class="dn">${d.d}</span><span class="dp">${pz(d.day)}</span><span class="ds" style="color:${scoreColor(d.score)}">${d.score}</span></button>`).join('')}</div>
  <div class="legend"><span><i class="sw" style="background:${cellBg(85)}"></i>Prime 75+</span><span><i class="sw" style="background:${cellBg(65)}"></i>Favourable 62+</span><span><i class="sw" style="background:var(--paper);border:1px solid var(--line)"></i>Neutral</span><span><i class="sw" style="background:${cellBg(38)}"></i>Careful</span><span><i class="sw" style="background:${cellBg(20)}"></i>Protect cash</span></div>`;
}
function spark(vals,labels){
  const W=700,H=150,pl=30,pr=10,pt=10,pb=24; const n=vals.length;
  const x=i=>pl+(W-pl-pr)*i/(n-1), yv=v=>pt+(H-pt-pb)*(1-(v-0)/100);
  const ma=vals.map((v,i)=>{ const s=vals.slice(Math.max(0,i-3),i+4); return s.reduce((a,b)=>a+b,0)/s.length; });
  const line=ma.map((v,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${yv(v).toFixed(1)}`).join('');
  const dots=vals.map((v,i)=>`<circle cx="${x(i).toFixed(1)}" cy="${yv(v).toFixed(1)}" r="2" fill="${scoreColor(v)}"/>`).join('');
  const grid=[25,50,75].map(g=>`<line x1="${pl}" x2="${W-pr}" y1="${yv(g)}" y2="${yv(g)}" stroke="var(--line)"/><text x="${pl-6}" y="${yv(g)+4}" text-anchor="end">${g}</text>`).join('');
  const lab=labels.map(l=>`<text x="${x(l.i)}" y="${H-6}" text-anchor="start">${l.t}</text>`).join('');
  return `<div class="tablewrap"><svg viewBox="0 0 ${W} ${H}" style="width:100%;min-width:480px;height:auto" role="img" aria-label="Daily wealth scores with a 7-day average line">${grid}${lab}<path d="${line} L${x(n-1)},${yv(0)} L${x(0)},${yv(0)} Z" fill="var(--jade-soft)" opacity=".7"/><path d="${line}" fill="none" stroke="var(--jade)" stroke-width="2"/>${dots}</svg></div><p class="note">Dots are daily scores; the line is the 7-day average.</p>`;
}

  const ok=storeProfiles(l); fillProfiles(p.id);
  $('#formMsg').textContent= ok ? `Saved “${name}” in this browser.` : 'This browser blocked saving; profiles will not persist.';
  run(p);
});
$('#profileSel').addEventListener('change',e=>{ const v=e.target.value; const p=v==='example'?EXAMPLE:loadProfiles().find(x=>x.id===v); if(p){ setForm(p); run(p);} });
$('#delBtn').addEventListener('click',()=>{ const v=$('#profileSel').value; if(v==='example') return; storeProfiles(loadProfiles().filter(x=>x.id!==v)); fillProfiles('example'); setForm(EXAMPLE); run(EXAMPLE); });
window.addEventListener('hashchange',setView);
(function init(){ const l=loadProfiles(); const p=l.length?l[0]:EXAMPLE; fillProfiles(p.id||'example'); setForm(p); CH=computeChart(toOpts(p)); PROF=p; setView(); })();
</script>
</body>
</html>
